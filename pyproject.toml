[project]
name = "jobagent"
version = "0.1.0"
description = "LangGraph agent + Docker harness that tailors resumes and fills job applications with human review before submit."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
    "langchain-ollama>=1,<2",
    "openai>=2,<3",
    "playwright>=1.55,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "cryptography>=46",
    "tenacity>=9,<10",
    "typer>=0.20,<1",
    "rich>=14",
    "pyyaml>=6.0.3",
    "httpx>=0.28,<1",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[project.scripts]
jobagent = "jobagent.main:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobagent"]

[tool.uv]
# Only resolve releases that have been public for a while (supply-chain hygiene).
exclude-newer = "2026-10-05T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end test that needs the running harness container and network",
]
addopts = "-m 'not e2e' -p no:cacheprovider"
