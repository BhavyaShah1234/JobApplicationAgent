# Pre-written answers to questions applications commonly ask.
# Matching uses the question, its aliases and embeddings; select/radio answers are fuzzy-matched to
# the form's actual options (e.g. "USA" → "United States of America").
#
# Fields per entry:
#   question:            canonical wording
#   aliases:             other wordings you've seen
#   answer:              what to fill (string, number or bool)
#   type:                text | select | bool | number
#   agent_instructions:  optional free-form guidance for the agent (e.g. "keep under 100 words").
#                        Instructions to make up personal facts (such as a fake address) are ignored and flagged at review.
#   tools:               optional lookups the agent runs before answering: web_search, maps
#                        (maps = OpenStreetMap: an office address, distance / driving time between two places).
#                        e.g. question "How far do you live from the office?", tools: [maps],
#                        agent_instructions: "Driving distance from my address in personal_info to the job's office."
#
# Questions only you can answer (company-specific ones) are asked on the spot (`jobagent hitl`) and kept in
# data/learned_answers.yaml for the next form that asks them.

- question: "Are you legally authorized to work in the United States?"
  aliases: ["Work authorization", "Authorized to work in the US?"]
  answer: true
  type: bool

- question: "Will you now or in the future require sponsorship for employment visa status?"
  aliases: ["Do you require visa sponsorship?", "Sponsorship required?"]
  answer: false
  type: bool

- question: "Country of residence"
  aliases: ["Country", "Current country"]
  answer: "United States"
  type: select

- question: "How did you hear about this position?"
  aliases: ["Source", "Where did you find this job?"]
  answer: "Company careers page"
  type: select
  agent_instructions: "The company's own website / careers site option (e.g. 'Adobe Source > Adobe.com', 'Palantir Website', 'Company Website'). Only if a referral contact with consent exists for this company, choose 'Referral' instead."

- question: "Desired salary"
  aliases: ["Salary expectations", "Expected compensation"]
  answer: ""
  type: text
  agent_instructions: "If the JD lists a pay range, answer 'Open / within the posted range'. Otherwise use preferences.yaml salary.min."

- question: "Why do you want to work here?"
  aliases: ["Why are you interested in this role?", "Why this company?"]
  answer: ""
  type: text
  agent_instructions: "Write 80-150 words from the company research (mission, products) tied to my matching experience. No clichés."

- question: "Are you willing to relocate?"
  aliases: ["Open to relocation?"]
  answer: true
  type: bool
  agent_instructions: "Yes. Don't mention a current city in written answers."

# --- Added 2026-11-02 from questions seen on application forms (step 12). Edit answers / instructions freely. ---

- question: "Which locations would you be open to working in?"
  aliases: ["Select all locations you would be open to being placed", "Preferred work location", "Office location preference"]
  answer: ""
  type: select
  agent_instructions: "Select every US location the form offers (open to relocation). Remote: also fine."

- question: "Have you worked at this company before?"
  aliases: ["Have you previously been employed by", "Are you a current or former employee", "Previous worker"]
  answer: ""
  type: bool
  agent_instructions: "No, unless the company is an employer on my resume."

- question: "Have you interviewed or applied with us before?"
  aliases: ["Have you previously applied", "Previously interviewed"]
  answer: ""
  type: bool
  agent_instructions: "Ask me (it depends on the company)."

- question: "When is your graduation date?"
  aliases: ["Please confirm your graduation date", "Expected graduation", "Graduation year"]
  answer: ""
  type: select
  agent_instructions: "End date of the latest degree in personal_info education; for a list of ranges pick the range that contains it."

- question: "What is your GPA?"
  aliases: ["Please indicate your most recent GPA", "Cumulative GPA"]
  answer: ""
  type: select
  agent_instructions: "GPA of the latest degree in personal_info; for ranges pick the one that contains it."

- question: "How many internships have you completed?"
  aliases: ["How many software engineering or closely related technical internships have you completed"]
  answer: ""
  type: select
  agent_instructions: "Count the internship roles on my resume."

- question: "Have you received a scholarship, fellowship or academic honor?"
  aliases: ["competitive academic scholarship", "academic honors or awards"]
  answer: ""
  type: bool
  agent_instructions: "Yes only if my resume lists one; otherwise No."

- question: "How many years of industry (non-internship) experience do you have?"
  aliases: ["Do you have over 2 years of industry work experience", "Years of relevant experience", "Years of professional experience"]
  answer: ""
  type: select
  agent_instructions: "Up to master_profile claims.years_experience; flag the answer for review."

- question: "Which technical domains or teams interest you most?"
  aliases: ["Which technical domains are you most interested in", "Which engineering organizations are you most interested in", "Team preference"]
  answer: ""
  type: select
  agent_instructions: "Choose the ones closest to the job description and my resume, within the number allowed (default 2-3)."

- question: "Earliest start date"
  aliases: ["When can you start?", "Available start date", "Date available"]
  answer: ""
  type: text
  agent_instructions: "From personal_info availability; if empty, ask me."

- question: "Do you agree to receive SMS / WhatsApp messages about your application?"
  aliases: ["receive communications via SMS", "text message consent", "WhatsApp"]
  answer: false
  type: bool

- question: "Applicant privacy notice / data processing acknowledgement"
  aliases: ["Applicant Privacy Acknowledgement", "I have read the privacy notice", "Consent to data processing"]
  answer: true
  type: bool
  agent_instructions: "Agree (needed to apply). Never agree to marketing or talent-community mailing lists."

- question: "Are you willing to travel?"
  aliases: ["Percentage of travel", "Travel requirement"]
  answer: ""
  type: select
  agent_instructions: "From personal_info availability.willing_to_travel; if empty, ask me."
