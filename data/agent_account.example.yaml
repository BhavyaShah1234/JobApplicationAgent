# Details for the agent's own Gmail account (step 1). Google requires a name, birthday and gender.
# The password is generated by the agent and kept in the encrypted vault (`jobagent vault show gmail`).

first_name: ""
last_name: ""
birthday: ""              # YYYY-MM-DD (must be 18+)
gender: "Rather not say"  # as shown in Google's dropdown: Female | Male | Rather not say
desired_username: ""      # without @gmail.com, e.g. firstname.lastname.careers; alternatives are asked if taken
recovery_email: ""        # optional: your personal email, used only for account recovery
