# Everything the resume and cover letter can draw from. Tailoring picks, reorders and rephrases from here.
# New skills a JD asks for are added to the resume and listed at review; approved ones are appended
# to `skills` automatically.

summary: ""

# What the agent may state about you to match a posting (the ATS loop and the resume writer read this).
# years_experience: the most years of experience a resume may claim, overall or in any domain a posting asks for.
claims:
  years_experience: 5

skills:
  languages: []          # e.g. [Python, Java, TypeScript]
  frameworks: []
  tools: []
  cloud: []
  other: []
  # Optional detail: {name: Kubernetes, proficiency: intermediate, years: 2}

experience:
  - company: ""
    title: ""
    location: ""
    start: ""            # YYYY-MM
    end: ""              # YYYY-MM or present
    bullets:
      - ""               # write achievements with numbers; tailoring rephrases, it doesn't invent outcomes
    tech: []

projects:
  - name: ""
    link: ""
    bullets: [""]
    tech: []

publications: []
certifications: []
awards: []
